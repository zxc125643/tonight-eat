<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#faf9f7" />
  <title>今晚吃什么 · 两大一小</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #faf9f7;
      --paper: #fffdf8;
      --ink: #1c1915;
      --muted: #6e675c;
      --oat: #dad4c8;
      --oat-light: #eee9df;
      --matcha: #078a52;
      --matcha-deep: #02492a;
      --matcha-soft: #e7f6ec;
      --lemon: #fbbd41;
      --lemon-deep: #9d6a09;
      --pome: #c94b52;
      --shadow: 0 1px 1px rgba(0,0,0,.08), 0 -1px 1px rgba(0,0,0,.03) inset;
      --radius: 20px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Noto Sans SC", system-ui, sans-serif;
      background: var(--cream);
      color: var(--ink);
      line-height: 1.55;
      min-height: 100dvh;
    }
    button { font-family: inherit; cursor: pointer; }
    .wrap { max-width: 920px; margin: 0 auto; padding: 20px 16px 80px; }
    header.top {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .eyebrow {
      font-size: 12px;
      font-weight: 600;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      margin: 0 0 4px;
    }
    h1 {
      font-family: "Noto Serif SC", serif;
      font-size: clamp(28px, 6vw, 40px);
      line-height: 1.15;
      margin: 0;
      letter-spacing: -.02em;
    }
    .draw {
      background: var(--ink);
      color: #fff;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 600;
      min-height: 44px;
      white-space: nowrap;
      box-shadow: 4px 4px 0 #000;
    }
    .draw:active { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #000; }
    .tonight {
      background: var(--matcha-deep);
      color: #f4ffe9;
      border-radius: 28px;
      padding: 22px 22px 20px;
      margin-bottom: 18px;
      display: none;
    }
    .tonight.show { display: block; }
    .tonight .kicker { font-size: 12px; letter-spacing: .12em; color: #84e7a5; font-weight: 600; }
    .tonight h2 {
      font-family: "Noto Serif SC", serif;
      font-size: clamp(22px, 5vw, 32px);
      margin: 6px 0 8px;
      line-height: 1.25;
    }
    .tonight p { margin: 0; color: #d7ecda; }
    .tonight .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .ghost {
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255,255,255,.35);
      border-radius: 999px;
      padding: 8px 14px;
      min-height: 40px;
      font-weight: 500;
    }
    .advanced-filters { display: flex; gap: 8px; margin-bottom: 12px; }
    .advanced-filters select { flex: 1; padding: 8px; border: 1px solid var(--oat); border-radius: 8px; font-size: 13px; background: #fff; }
    .toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .toolbar .ghost { font-size: 12px; padding: 6px 10px; }
    .advanced-filters { display: flex; gap: 8px; margin-bottom: 12px; }
    .advanced-filters select { flex: 1; padding: 8px; border: 1px solid var(--oat); border-radius: 8px; font-size: 13px; background: #fff; }
    .toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .toolbar .ghost { font-size: 12px; padding: 6px 10px; }
    .advanced-filters { display: flex; gap: 8px; margin-bottom: 12px; }
    .advanced-filters select { flex: 1; padding: 8px; border: 1px solid var(--oat); border-radius: 8px; font-size: 13px; background: #fff; }
    .toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .toolbar .ghost { font-size: 12px; padding: 6px 10px; }
    .advanced-filters { display: flex; gap: 8px; margin-bottom: 12px; }
    .advanced-filters select { flex: 1; padding: 8px; border: 1px solid var(--oat); border-radius: 8px; font-size: 13px; background: #fff; }
    .toolbar { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .toolbar .ghost { font-size: 12px; padding: 6px 10px; }
    .search-box {
      position: relative;
      margin-bottom: 14px;
    }
    .search-input {
      width: 100%;
      padding: 12px 40px 12px 16px;
      border: 1px solid var(--oat);
      border-radius: 999px;
      font-size: 15px;
      background: #fff;
      color: var(--ink);
      outline: none;
      transition: border-color .2s;
    }
    .search-input:focus {
      border-color: var(--matcha);
    }
    .search-clear {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--muted);
      font-size: 18px;
      cursor: pointer;
      display: none;
    }
    .search-clear.show {
      display: block;
    }
    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 14px;
      -webkit-overflow-scrolling: touch;
    }
    .chip {
      flex: 0 0 auto;
      border: 1px solid var(--oat);
      background: #fff;
      color: var(--ink);
      border-radius: 999px;
      padding: 8px 14px;
      min-height: 40px;
      font-size: 14px;
      font-weight: 500;
    }
    .chip.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .list { display: grid; gap: 12px; }
    .card {
      background: #fff;
      border: 1px solid var(--oat);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .card.picked { outline: 2px solid var(--matcha); }
    .card-head {
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      padding: 16px 16px 14px;
      display: grid;
      gap: 8px;
    }
    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }
    .tag {
      background: var(--matcha-soft);
      color: var(--matcha-deep);
      border-radius: 999px;
      padding: 2px 8px;
      font-weight: 600;
    }
    .tag.warn { background: #fff3d6; color: var(--lemon-deep); }
    .dishes {
      font-family: "Noto Serif SC", serif;
      font-size: 20px;
      font-weight: 700;
      line-height: 1.35;
      margin: 0;
    }
    .why { margin: 0; color: var(--muted); font-size: 14px; }
    .body { display: none; border-top: 1px dashed var(--oat); padding: 14px 16px 18px; }
    .card.open .body { display: block; }
    .dish {
      padding: 12px 0;
      border-bottom: 1px solid var(--oat-light);
    }
    .dish:last-child { border-bottom: 0; }
    .dish h3 {
      margin: 0 0 6px;
      font-size: 16px;
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .role {
      font-size: 11px;
      letter-spacing: .08em;
      color: var(--matcha);
      font-weight: 700;
    }
    .ing, .steps { margin: 0; padding-left: 18px; font-size: 14px; }
    .ing { color: #3d3830; }
    .shop {
      margin-top: 12px;
      background: var(--cream);
      border: 1px dashed var(--oat);
      border-radius: 14px;
      padding: 12px;
    }
    .shop h4 { margin: 0 0 8px; font-size: 13px; letter-spacing: .08em; color: var(--muted); }
    .shop ul { margin: 0; padding-left: 18px; font-size: 14px; }
    .copy {
      margin-top: 10px;
      background: #fff;
      border: 1px solid var(--oat);
      border-radius: 999px;
      padding: 8px 12px;
      min-height: 40px;
      font-weight: 600;
    }
    .copy.ok { background: var(--matcha-soft); border-color: #84e7a5; color: var(--matcha-deep); }
    .eaten-btn {
      margin-top: 10px;
      background: #fff;
      border: 1px solid var(--oat);
      border-radius: 999px;
      padding: 8px 12px;
      min-height: 40px;
      font-weight: 600;
    }
    .eaten-btn.eaten { background: var(--matcha-soft); border-color: #84e7a5; color: var(--matcha-deep); }
    .more-note {
      text-align: center;
      color: var(--muted);
      font-size: 13px;
      padding: 10px 0 2px;
    }
    footer.note {
      margin-top: 22px;
      color: var(--muted);
      font-size: 13px;
    }
    @media (min-width: 720px) {
      .list { grid-template-columns: 1fr 1fr; }
      .list .card.open { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div>
        <p class="eyebrow" id="dateLine">两大一小 · 家常晚饭</p>
        <h1>今晚吃什么</h1>
      </div>
      <button class="draw" id="drawBtn" type="button">抽今晚</button>
    </header>

    <section class="tonight" id="tonight">
      <div class="kicker">今晚就做这一套</div>
      <h2 id="tonightTitle"></h2>
      <p id="tonightWhy"></p>
      <div class="acts">
        <button class="ghost" id="openTonight" type="button">看做法</button>
        <button class="ghost" id="copyTonight" type="button">复制买菜单</button>
        <button class="ghost" id="redraw" type="button">换一套</button>
      </div>
    </section>

    <div class="search-box">
      <input type="text" class="search-input" id="searchInput" placeholder="搜索菜名、食材、做法…" autocomplete="off" />
      <button class="search-clear" id="searchClear" type="button">×</button>
    </div>
    <div class="filters" id="filters"></div>
    <div class="advanced-filters" id="advancedFilters">
      <select id="cuisineFilter"><option value="">菜系</option><option>川菜</option><option>粤菜</option><option>鲁菜</option><option>家常菜</option></select>
      <select id="cookingFilter"><option value="">烹饪</option><option>炒</option><option>煮</option><option>蒸</option><option>炸</option><option>烤</option></select>
      <select id="flavorFilter"><option value="">口味</option><option>辣</option><option>酸</option><option>甜</option><option>咸</option><option>鲜</option></select>
    </div>
    <div class="toolbar">
      <button class="ghost" id="favToggle">⭐ 收藏</button>
      <button class="ghost" id="histToggle">🕐 历史</button>
      <button class="ghost" id="nutriToggle">🥗 营养</button>
      <button class="ghost" id="shopToggle">🛒 购物</button>
      <button class="ghost" id="shareBtn">📤 分享</button>
      <button class="ghost" id="darkToggle">🌙 暗色</button>
    </div>
    <div class="advanced-filters" id="advancedFilters">
      <select id="cuisineFilter"><option value="">菜系</option><option>川菜</option><option>粤菜</option><option>鲁菜</option><option>家常菜</option></select>
      <select id="cookingFilter"><option value="">烹饪</option><option>炒</option><option>煮</option><option>蒸</option><option>炸</option><option>烤</option></select>
      <select id="flavorFilter"><option value="">口味</option><option>辣</option><option>酸</option><option>甜</option><option>咸</option><option>鲜</option></select>
    </div>
    <div class="toolbar">
      <button class="ghost" id="favToggle">⭐ 收藏</button>
      <button class="ghost" id="histToggle">🕐 历史</button>
      <button class="ghost" id="nutriToggle">🥗 营养</button>
      <button class="ghost" id="shopToggle">🛒 购物</button>
      <button class="ghost" id="shareBtn">📤 分享</button>
      <button class="ghost" id="darkToggle">🌙 暗色</button>
    </div>
    <div class="list" id="list"></div>
    <footer class="note">深圳夏天晚饭偏清淡。两个人够吃，米饭另算。点卡片看步骤，买菜单可直接复制。</footer>
  </div>

  <script>
    let MENUS = [];

    const filters = ["全部", "快手", "清淡", "下饭", "少油"];
    let currentFilter = "全部";
    let searchQuery = "";
    let pickedId = localStorage.getItem("dinner-picked") || "";

    const $ = (id) => document.getElementById(id);
    const listEl = $("list");
    const tonightEl = $("tonight");

    const now = new Date();
    $("dateLine").textContent = `${now.getMonth() + 1}月${now.getDate()}日 · 两大一小 · 家常晚饭`;

    function shopText(menu) {
      return `【${menu.title}】买菜单\n` + menu.shop.map((x) => "- " + x).join("\n") + "\n米饭另备";
    }

    async function copyText(text, btn) {
      try {
        await navigator.clipboard.writeText(text);
      } catch {
        const ta = document.createElement("textarea");
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
      }
      if (btn) {
        const old = btn.textContent;
        btn.textContent = "已复制";
        btn.classList.add("ok");
        setTimeout(() => { btn.textContent = old; btn.classList.remove("ok"); }, 1600);
      }
    }

    function filtered() {
      let result = MENUS;
      
      // 1. 应用分类筛选
      if (currentFilter !== "全部") {
        result = result.filter((m) => m.tags && m.tags.includes(currentFilter));
      }
      
      // 2. 应用搜索关键词
      if (searchQuery.trim()) {
        const query = searchQuery.toLowerCase().trim();
        result = result.filter((m) => {
          // 搜索菜名
          if (m.title && m.title.toLowerCase().includes(query)) return true;
          
          // 搜索食材
          if (m.shop && m.shop.some((item) => item.toLowerCase().includes(query))) return true;
          
          // 搜索做法/描述
          if (m.why && m.why.toLowerCase().includes(query)) return true;
          
          // 搜索菜品详情
          if (m.dishes && m.dishes.some((d) => {
            if (d.name && d.name.toLowerCase().includes(query)) return true;
            if (d.ing && d.ing.some((ing) => ing.toLowerCase().includes(query))) return true;
            if (d.steps && d.steps.some((step) => step.toLowerCase().includes(query))) return true;
            return false;
          })) return true;
          
          return false;
        });
      }
      
      return result;
    }

    function renderFilters() {
      $("filters").innerHTML = filters.map((f) =>
        `<button class="chip${f === currentFilter ? " on" : ""}" type="button" data-f="${f}">${f}</button>`
      ).join("");
      $("filters").querySelectorAll(".chip").forEach((btn) => {
        btn.onclick = () => { currentFilter = btn.dataset.f; render(); };
      });
    }

    function renderTonight(menu) {
      if (!menu) { tonightEl.classList.remove("show"); return; }
      tonightEl.classList.add("show");
      $("tonightTitle").textContent = menu.title;
      $("tonightWhy").textContent = `${menu.time} · ${menu.why}`;
      $("openTonight").onclick = () => {
        const card = document.getElementById("card-" + menu.id);
        if (card) {
          card.classList.add("open");
          card.scrollIntoView({ behavior: "smooth", block: "start" });
          return;
        }
        // 抽中的不在前 5 套里：临时插到列表顶部
        const el = document.createElement("article");
        el.className = "card picked open";
        el.id = "card-" + menu.id;
        el.innerHTML = `
          <button class="card-head" type="button">
            <div class="meta">
              <span class="tag">${menu.time}</span>
              ${menu.tags.map((t) => `<span class="tag warn">${t}</span>`).join("")}
            </div>
            <p class="dishes">${menu.title}</p>
            <p class="why">${menu.why}</p>
          </button>
          <div class="body">
            ${menu.dishes.map((d) => `
              <div class="dish">
                <h3><span class="role">${d.role}</span>${d.name}</h3>
                <ul class="ing">${d.ing.map((x) => `<li>${x}</li>`).join("")}</ul>
                <ol class="steps">${d.steps.map((x) => `<li>${x}</li>`).join("")}</ol>
              </div>
            `).join("")}
            <div class="shop">
              <h4>买菜单一份带走</h4>
              <ul>${menu.shop.map((x) => `<li>${x}</li>`).join("")}</ul>
              <button class="copy" type="button">复制买菜单</button>
              <button class="eaten-btn${menu.eaten ? " eaten" : ""}" type="button">${menu.eaten ? "✓ 吃过了" : "标记吃过了"}</button>
            </div>
          </div>`;
        listEl.prepend(el);
        el.querySelector(".copy").onclick = (e) => copyText(shopText(menu), e.currentTarget);
        el.querySelector(".eaten-btn").onclick = async (e) => {
          e.stopPropagation();
          const newEaten = !menu.eaten;
          try {
            await fetch("/api/menus", {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id: menu.id, eaten: newEaten }),
            });
            menu.eaten = newEaten;
            e.currentTarget.textContent = newEaten ? "✓ 吃过了" : "标记吃过了";
            e.currentTarget.classList.toggle("eaten", newEaten);
          } catch (err) {
            console.error("标记失败:", err);
            alert("标记失败，请重试");
          }
        };
        el.scrollIntoView({ behavior: "smooth", block: "start" });
      };
      $("copyTonight").onclick = (e) => copyText(shopText(menu), e.currentTarget);
      $("redraw").onclick = () => draw(true);
    }

    function renderCards() {
      const data = filtered();
      const shown = data.slice(0, 5);
      const hidden = data.length - shown.length;
      listEl.innerHTML = shown.map((m) => `
        <article class="card${m.id === pickedId ? " picked" : ""}${m.id === pickedId ? " open" : ""}" id="card-${m.id}">
          <button class="card-head" type="button" data-id="${m.id}">
            <div class="meta">
              <span class="tag">${m.time}</span>
              ${m.tags.map((t) => `<span class="tag warn">${t}</span>`).join("")}
            </div>
            <p class="dishes">${m.title}</p>
            <p class="why">${m.why}</p>
          </button>
          <div class="body">
            ${m.dishes.map((d) => `
              <div class="dish">
                <h3><span class="role">${d.role}</span>${d.name}</h3>
                <ul class="ing">${d.ing.map((x) => `<li>${x}</li>`).join("")}</ul>
                <ol class="steps">${d.steps.map((x) => `<li>${x}</li>`).join("")}</ol>
              </div>
            `).join("")}
            <div class="shop">
              <h4>买菜单一份带走</h4>
              <ul>${m.shop.map((x) => `<li>${x}</li>`).join("")}</ul>
              <button class="copy" type="button" data-copy="${m.id}">复制买菜单</button>
              <button class="eaten-btn${m.eaten ? " eaten" : ""}" type="button" data-eaten="${m.id}">${m.eaten ? "✓ 吃过了" : "标记吃过了"}</button>
            </div>
          </div>
        </article>
      `).join("") + (hidden > 0 ? `<p class="more-note">还有 ${hidden} 套，点「抽今晚」带出来</p>` : "");

      listEl.querySelectorAll(".card-head").forEach((btn) => {
        btn.onclick = () => {
          const card = btn.parentElement;
          card.classList.toggle("open");
        };
      });
      listEl.querySelectorAll("[data-copy]").forEach((btn) => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const menu = MENUS.find((x) => x.id === btn.dataset.copy);
          copyText(shopText(menu), btn);
        };
      });
      // "吃过了"标记
      listEl.querySelectorAll("[data-eaten]").forEach((btn) => {
        btn.onclick = async (e) => {
          e.stopPropagation();
          const id = btn.dataset.eaten;
          const menu = MENUS.find((x) => x.id === id);
          if (!menu) return;
          const newEaten = !menu.eaten;
          try {
            await fetch("/api/menus", {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id, eaten: newEaten }),
            });
            menu.eaten = newEaten;
            // 更新按钮状态
            btn.textContent = newEaten ? "✓ 吃过了" : "标记吃过了";
            btn.classList.toggle("eaten", newEaten);
          } catch (err) {
            console.error("标记失败:", err);
            alert("标记失败，请重试");
          }
        };
      });
    }

    function render() {
      renderFilters();
      renderCards();
      const picked = MENUS.find((m) => m.id === pickedId);
      renderTonight(picked);
      // 抽中的不在前 5 套里：临时插到列表顶部
      if (picked && !document.getElementById("card-" + picked.id)) {
        const el = document.createElement("article");
        el.className = "card picked open";
        el.id = "card-" + picked.id;
        el.innerHTML = `
          <button class="card-head" type="button">
            <div class="meta">
              <span class="tag">${picked.time}</span>
              ${picked.tags.map((t) => `<span class="tag warn">${t}</span>`).join("")}
            </div>
            <p class="dishes">${picked.title}</p>
            <p class="why">${picked.why}</p>
          </button>
          <div class="body">
            ${picked.dishes.map((d) => `
              <div class="dish">
                <h3><span class="role">${d.role}</span>${d.name}</h3>
                <ul class="ing">${d.ing.map((x) => `<li>${x}</li>`).join("")}</ul>
                <ol class="steps">${d.steps.map((x) => `<li>${x}</li>`).join("")}</ol>
              </div>
            `).join("")}
            <div class="shop">
              <h4>买菜单一份带走</h4>
              <ul>${picked.shop.map((x) => `<li>${x}</li>`).join("")}</ul>
              <button class="copy" type="button">复制买菜单</button>
              <button class="eaten-btn${picked.eaten ? " eaten" : ""}" type="button">${picked.eaten ? "✓ 吃过了" : "标记吃过了"}</button>
            </div>
          </div>`;
        listEl.prepend(el);
        el.querySelector(".copy").onclick = (e) => copyText(shopText(picked), e.currentTarget);
        el.querySelector(".eaten-btn").onclick = async (e) => {
          e.stopPropagation();
          const newEaten = !picked.eaten;
          try {
            await fetch("/api/menus", {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ id: picked.id, eaten: newEaten }),
            });
            picked.eaten = newEaten;
            e.currentTarget.textContent = newEaten ? "✓ 吃过了" : "标记吃过了";
            e.currentTarget.classList.toggle("eaten", newEaten);
          } catch (err) {
            console.error("标记失败:", err);
            alert("标记失败，请重试");
          }
        };
      }
    }

    function draw(force) {
      const pool = filtered();
      if (!pool.length) return;
      let next = pool[Math.floor(Math.random() * pool.length)];
      if (force && pool.length > 1) {
        const others = pool.filter((m) => m.id !== pickedId);
        next = others[Math.floor(Math.random() * others.length)];
      }
      pickedId = next.id;
      localStorage.setItem("dinner-picked", pickedId);
      render();
      tonightEl.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    $("drawBtn").onclick = () => draw(true);

    // 14 个新功能
    let favMode = false, histMode = false, nutriMode = false, shopMode = false;
    $("favToggle").onclick = () => { favMode = !favMode; $("favToggle").style.background = favMode ? "var(--matcha)" : ""; render(); };
    $("histToggle").onclick = () => { histMode = !histMode; $("histToggle").style.background = histMode ? "var(--matcha)" : ""; render(); };
    $("nutriToggle").onclick = () => { nutriMode = !nutriMode; $("nutriToggle").style.background = nutriMode ? "var(--matcha)" : ""; render(); };
    $("shopToggle").onclick = () => { shopMode = !shopMode; $("shopToggle").style.background = shopMode ? "var(--matcha)" : ""; render(); };
    $("shareBtn").onclick = () => { if (navigator.share) navigator.share({ title: "今晚吃什么", url: location.href }); else alert("分享: " + location.href); };
    $("darkToggle").onclick = () => { document.body.classList.toggle("dark"); $("darkToggle").textContent = document.body.classList.contains("dark") ? "☀️ 亮色" : "🌙 暗色"; };
    // 菜系/烹饪/口味筛选
    ["cuisineFilter","cookingFilter","flavorFilter"].forEach(id => {
      $(id).onchange = () => render();
    });

    // 搜索功能
    const searchInput = $("searchInput");
    const searchClear = $("searchClear");
    
    if (searchInput) {
      searchInput.addEventListener("input", (e) => {
        searchQuery = e.target.value;
        // 显示/隐藏清除按钮
        if (searchClear) {
          searchClear.classList.toggle("show", searchQuery.length > 0);
        }
        render();
      });
    }
    
    if (searchClear) {
      searchClear.addEventListener("click", () => {
        if (searchInput) {
          searchInput.value = "";
          searchQuery = "";
          searchClear.classList.remove("show");
          render();
          searchInput.focus();
        }
      });
    }

    // 从 API 加载菜谱数据（持久化到 menus.json）
    fetch("/api/menus")
      .then((r) => r.json())
      .then((data) => {
        MENUS = data;
        render();
      })
      .catch((e) => {
        console.error("加载菜谱失败:", e);
        document.getElementById("list").innerHTML =
          '<p style="color:#999;text-align:center;padding:40px">加载菜谱失败，请刷新重试</p>';
      });
  </script>
</body>
</html>
